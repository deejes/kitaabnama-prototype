<style>
:root{--bg:#fff;--fg:#1d1b19;--muted:#8b867f;--line:#0000001a;--chrome:rgba(255,255,255,.86);--accent:#C8862A;--hl:#ffe08a;
 --font:'Literata',Georgia,serif;--size:20px;--lh:1.6;--margin:64px;--ui:'Inter',system-ui,sans-serif}
[data-theme=sepia]{--bg:#f6efe1;--fg:#3b2f22;--muted:#9a8a73;--line:#5b452a22;--chrome:rgba(246,239,225,.9);--hl:#f3cf77}
[data-theme=gray]{--bg:#4a4a4c;--fg:#e9e7e3;--muted:#a8a6a2;--line:#ffffff1f;--chrome:rgba(74,74,76,.9);--hl:#8a6d2a}
[data-theme=dark]{--bg:#121212;--fg:#cfcac2;--muted:#77736d;--line:#ffffff17;--chrome:rgba(18,18,18,.88);--hl:#6b5520;--accent:#E0A84E}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .3s,color .3s}
body{font-family:var(--ui);-webkit-tap-highlight-color:transparent}
#book{position:absolute;top:72px;bottom:64px;left:var(--margin);right:var(--margin);overflow:hidden}
#flow{height:100%;column-fill:auto;font-family:var(--font);font-size:var(--size);line-height:var(--lh);transition:transform .38s cubic-bezier(.2,.7,.2,1);will-change:transform}
#flow.nojank{transition:none}
#flow p{margin:0;text-indent:1.4em;text-align:justify;hyphens:auto;-webkit-hyphens:auto;orphans:2;widows:2}
#flow.ragged p{text-align:left}
#flow .ch{break-before:column}
#flow .ch:first-child{break-before:auto}
#flow .ch-head{text-align:center;padding:12vh 0 2.2em}
#flow .ch-num{font:500 .62em var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
#flow h2{font-weight:400;font-size:1.55em;line-height:1.2;margin:.5em 0 0;font-style:italic}
#flow .ch-head:after{content:"";display:block;width:36px;height:1px;background:var(--muted);opacity:.5;margin:1.4em auto 0}
#flow .first{text-indent:0}
#flow .first:first-letter{float:left;font-size:3.35em;line-height:.86;padding:.06em .08em 0 0;color:var(--accent);font-weight:600}
#flow .first .sc{font-variant:small-caps;letter-spacing:.04em}
#flow .verse{text-indent:0;text-align:left;margin:.6em 0 .6em 2em;font-style:italic}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
/* chrome */
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--chrome);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px);transition:transform .3s,opacity .3s}
#top{top:0;border-bottom:1px solid var(--line)}#bottom{bottom:0;border-top:1px solid var(--line);flex-direction:column;align-items:stretch;gap:8px;padding:12px 22px 14px}
body.immersive #top{transform:translateY(-100%);opacity:0}body.immersive #bottom{transform:translateY(100%);opacity:0}
.ib{border:0;background:none;color:var(--fg);height:38px;min-width:38px;border-radius:10px;font:500 15px var(--ui);cursor:pointer;display:grid;place-items:center;padding:0 8px}
.ib:hover{background:var(--line)}.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.on svg{fill:var(--accent);stroke:var(--accent)}
#title{flex:1;text-align:center;font:600 14px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#title small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.swbtn{background:linear-gradient(135deg,#F2B45A,#C8862A);color:#fff!important;padding:0 12px;gap:6px;display:flex;font-weight:600}
.scrub{position:relative;height:18px;cursor:pointer}.scrub .track{position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line);border-radius:2px}
.scrub .fill{position:absolute;top:8px;left:0;height:2px;background:var(--fg);border-radius:2px}.scrub .knob{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--fg)}
.scrub .tick{position:absolute;top:6px;width:1px;height:6px;background:var(--muted)}
.prow{display:flex;justify-content:space-between;font:12px var(--ui);color:var(--muted)}
/* always-visible minimal footer, like Kindle */
#mini{position:fixed;bottom:22px;left:var(--margin);right:var(--margin);display:flex;justify-content:space-between;font:11.5px var(--ui);color:var(--muted);letter-spacing:.02em;pointer-events:none;transition:opacity .3s}
body:not(.immersive) #mini{opacity:0}
#runhead{position:fixed;top:30px;left:var(--margin);right:var(--margin);text-align:center;font:11.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .3s}
body:not(.immersive) #runhead{opacity:0}
#ribbon{position:fixed;top:0;right:calc(var(--margin) - 34px);width:18px;height:40px;background:#D9534F;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);transform:translateY(-44px);transition:transform .25s;z-index:5}
#ribbon.on{transform:none}
/* sheets */
.sheet{position:fixed;z-index:40;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #0004;font-family:var(--ui);opacity:0;pointer-events:none;transform:translateY(8px) scale(.98);transition:.2s}
.sheet.open{opacity:1;pointer-events:auto;transform:none}
#aa{top:62px;right:14px;width:340px;padding:16px}
.row{display:flex;gap:8px;margin-bottom:14px}.lbl{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.seg{flex:1;border:1px solid var(--line);background:none;color:var(--fg);border-radius:10px;padding:9px 6px;cursor:pointer;font:500 13px var(--ui)}.seg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw{flex:1;height:54px;border-radius:12px;border:1px solid #0002;cursor:pointer;font:600 15px Literata,serif;display:grid;place-items:center}.sw.on{box-shadow:0 0 0 2px var(--accent)}
.fonts .seg{font-size:16px}.sizes .seg{font-family:Georgia,serif}
#toc{top:62px;left:14px;width:320px;padding:8px;max-height:70vh;overflow:auto}
#toc a{display:flex;justify-content:space-between;padding:12px 12px;border-radius:10px;color:var(--fg);text-decoration:none;font:15px var(--ui);cursor:pointer}#toc a:hover{background:var(--line)}#toc a.cur{font-weight:600}#toc a span{color:var(--muted)}
#toc h4{margin:8px 12px;font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#pop{position:fixed;z-index:45;display:flex;background:#2b2a28;border-radius:12px;padding:4px;box-shadow:0 10px 30px #0005;opacity:0;pointer-events:none;transition:opacity .15s;transform:translate(-50%,-100%)}
#pop.open{opacity:1;pointer-events:auto}#pop button{border:0;background:none;color:#fff;font:500 14px var(--ui);padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}#pop button:hover{background:#ffffff1f}
#pop:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#2b2a28}
#pop .dots{display:flex;gap:6px;align-items:center;padding:0 8px;border-left:1px solid #ffffff22}#pop .dots i{width:16px;height:16px;border-radius:50%;cursor:pointer}
/* Swati slide-over */
#swati{position:fixed;z-index:30;width:min(370px,calc(100vw - 24px));height:min(640px,calc(100vh - 110px));top:76px;left:0;background:#fffdf8;color:#2a2622;border-radius:22px;box-shadow:0 24px 70px #0000004d,0 0 0 .5px #0000001f;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ui);transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),opacity .25s;touch-action:none}
[data-theme=dark] #swati,[data-theme=gray] #swati{background:#262422;color:#ece6dc}
#swati.drag{transition:none}#swati.hidden{opacity:0;pointer-events:none}
.grab{height:22px;display:grid;place-items:center;cursor:grab;flex:none}.grab:active{cursor:grabbing}.grab i{width:40px;height:5px;border-radius:3px;background:#0000002e}[data-theme=dark] .grab i,[data-theme=gray] .grab i{background:#ffffff40}
.sh{display:flex;align-items:center;gap:10px;padding:0 14px 10px;cursor:grab}
.face{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE1A0,#E39A35);display:grid;place-items:center;font-size:20px;flex:none}
.sh b{font-size:15px;display:block}.sh small{font-size:12px;color:#5f8f62}
.sh button{margin-left:auto;border:0;background:#0000000d;color:inherit;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.sbody{flex:1;overflow:auto;padding:4px 14px;touch-action:pan-y}
.m{max-width:88%;padding:9px 13px;border-radius:16px;margin:7px 0;font-size:14.5px;line-height:1.45}.m.s{background:#f7e6c6;color:#2a2622;border-bottom-left-radius:5px}.m.u{background:#7A2E3B;color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.m blockquote{margin:0 0 6px;padding-left:8px;border-left:2px solid #ffffff88;font-style:italic;opacity:.9}
.wc{background:#fff6e4;color:#2a2622;border-radius:16px;padding:14px;margin:8px 0}.wc h3{margin:0;font:600 24px Literata,serif;color:#7A2E3B}.wc .ph{color:#8a7d6b;font-size:13px;margin:2px 0 8px}.wc .syl span{display:inline-block;border:2px dashed #E39A35;border-radius:8px;padding:2px 8px;margin:0 4px 6px 0;font-weight:700}.wc p{margin:6px 0;font-size:14px}.wc button{border:0;background:#E39A35;color:#fff;border-radius:14px;padding:5px 11px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;flex:none}.chips button{flex:none;border:1px solid #e4cfa8;background:transparent;color:inherit;border-radius:16px;padding:6px 10px;font:500 12.5px var(--ui);cursor:pointer}
.ask{display:flex;gap:8px;padding:10px 14px 14px;flex:none}.ask input{flex:1;min-width:0;border:1px solid #0000001f;background:#fff;border-radius:20px;padding:9px 13px;font:14px var(--ui)}.ask button{border:0;width:38px;border-radius:50%;background:#E39A35;color:#fff;font-size:16px;cursor:pointer}
#tab{position:fixed;z-index:31;width:30px;height:96px;top:200px;background:linear-gradient(180deg,#F2B45A,#C8862A);box-shadow:0 6px 20px #0004;cursor:pointer;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;touch-action:none;transition:top .3s}
#tab.show{display:flex}#tab.r{right:0;border-radius:14px 0 0 14px}#tab.l{left:0;border-radius:0 14px 14px 0}
#tab span{font-size:16px}#tab i{width:4px;height:30px;border-radius:2px;background:#ffffffaa}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000a;color:#fff;font:13px var(--ui);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
@media (max-width:700px){:root{--margin:22px}#book{top:56px;bottom:52px}#runhead{top:20px}#mini{bottom:16px}#aa{left:10px;right:10px;width:auto;top:auto;bottom:10px}#toc{left:10px;right:10px;width:auto}.hide-sm{display:none}#swati{height:min(560px,calc(100vh - 90px))}}

/* ===== Swati — HIG redesign ===== */
:root{--sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif}
#swati{font-family:var(--sys);background:rgba(250,249,247,.86)!important;color:#1c1c1e!important;backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.12),inset 0 .5px 0 rgba(255,255,255,.7);letter-spacing:-.01em}
[data-theme=dark] #swati,[data-theme=gray] #swati{background:rgba(44,44,46,.88)!important;color:#f2f2f7!important;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.14),inset 0 .5px 0 rgba(255,255,255,.12)}
.grab{height:20px}.grab i{width:36px;height:5px;background:rgba(60,60,67,.3)}
.sh{padding:2px 18px 14px;gap:12px}
.orb{width:34px;height:34px;border-radius:50%;flex:none;position:relative;background:conic-gradient(from var(--a,0deg),#ff9f6b,#ff6fb5,#a37bff,#5ac8fa,#7ee0a1,#ffd36b,#ff9f6b);animation:spin 6s linear infinite;filter:saturate(1.1)}
.orb:after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 45%,rgba(255,255,255,0) 70%)}
.orb.sm{width:18px;height:18px}.orb.sm:after{inset:2px}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
.sh b{font:600 17px var(--sys);letter-spacing:-.02em}.sh small{font:400 12.5px var(--sys);color:rgba(60,60,67,.6)}
[data-theme=dark] .meta,[data-theme=gray] .meta,[data-theme=dark] .sh small,[data-theme=gray] .sh small{color:rgba(235,235,245,.6)}
.sh button{width:30px;height:30px;background:rgba(120,120,128,.14);display:grid;place-items:center}.sh button svg,.sic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.segc{display:flex;margin:0 18px 10px;padding:2px;background:rgba(118,118,128,.14);border-radius:9px;flex:none}
.segc button{flex:1;border:0;background:none;color:inherit;font:500 13px var(--sys);padding:6px 0;border-radius:7px;cursor:pointer}
.segc button.on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
[data-theme=dark] .segc button.on,[data-theme=gray] .segc button.on{background:#636366}
.sbody{padding:4px 18px 8px}
.m{font:400 15px/1.42 var(--sys);padding:10px 14px;border-radius:18px;margin:8px 0}
.m.s{background:rgba(255,255,255,.75);color:inherit;box-shadow:0 0 0 .5px rgba(0,0,0,.06);border-bottom-left-radius:6px}

.ask{padding:10px 14px 16px;gap:0}

.swbtn{background:none!important;color:var(--fg)!important;gap:7px;font-family:var(--sys)!important}
.swbtn:hover{background:var(--line)!important}

<script>
const CH=[{"n": 1, "title": "Down the Rabbit-Hole", "paras": ["Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”", "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.", "There was nothing so <em>very</em> remarkable in that; nor did Alice think it so <em>very</em> much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually <em>took a watch out of its waistcoat-pocket</em>, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.", "In another moment down went Alice after it, never once considering how in the world she was to get out again.", "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.", "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “ORANGE MARMALADE”, but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it.", "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)", "Down, down, down. Would the fall <em>never</em> come to an end? “I wonder how many miles I’ve fallen by this time?” she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a <em>very</em> good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)", "Presently she began again. “I wonder if I shall fall right <em>through</em> the earth! How funny it’ll seem to come out among the people that walk with their heads downward! The Antipathies, I think—” (she was rather glad there <em>was</em> no one listening, this time, as it didn’t sound at all the right word) “—but I shall have to ask them what the name of the country is, you know. Please, Ma’am, is this New Zealand or Australia?” (and she tried to curtsey as she spoke—fancy <em>curtseying</em> as you’re falling through the air! Do you think you could manage it?) “And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”", "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.", "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.", "There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.", "Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!", "Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I think I could, if I only knew how to begin.” For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible.", "There seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it, (“which certainly was not here before,” said Alice,) and round the neck of the bottle was a paper label, with the words “DRINK ME,” beautifully printed on it in large letters.", "It was all very well to say “Drink me,” but the wise little Alice was not going to do <em>that</em> in a hurry. “No, I’ll look first,” she said, “and see whether it’s marked ‘<em>poison</em>’ or not”; for she had read several nice little histories about children who had got burnt, and eaten up by wild beasts and other unpleasant things, all because they <em>would</em> not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it too long; and that if you cut your finger <em>very</em> deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked “poison,” it is almost certain to disagree with you, sooner or later.", "However, this bottle was <em>not</em> marked “poison,” so Alice ventured to taste it, and finding it very nice, (it had, in fact, a sort of mixed flavour of cherry-tart, custard, pine-apple, roast turkey, toffee, and hot buttered toast,) she very soon finished it off.", "“What a curious feeling!” said Alice; “I must be shutting up like a telescope.”", "And so it was indeed: she was now only ten inches high, and her face brightened up at the thought that she was now the right size for going through the little door into that lovely garden. First, however, she waited for a few minutes to see if she was going to shrink any further: she felt a little nervous about this; “for it might end, you know,” said Alice to herself, “in my going out altogether, like a candle. I wonder what I should be like then?” And she tried to fancy what the flame of a candle is like after the candle is blown out, for she could not remember ever having seen such a thing.", "After a while, finding that nothing more happened, she decided on going into the garden at once; but, alas for poor Alice! when she got to the door, she found she had forgotten the little golden key, and when she went back to the table for it, she found she could not possibly reach it: she could see it quite plainly through the glass, and she tried her best to climb up one of the legs of the table, but it was too slippery; and when she had tired herself out with trying, the poor little thing sat down and cried.", "“Come, there’s no use in crying like that!” said Alice to herself, rather sharply; “I advise you to leave off this minute!” She generally gave herself very good advice, (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; and once she remembered trying to box her own ears for having cheated herself in a game of croquet she was playing against herself, for this curious child was very fond of pretending to be two people. “But it’s no use now,” thought poor Alice, “to pretend to be two people! Why, there’s hardly enough of me left to make <em>one</em> respectable person!”", "Soon her eye fell on a little glass box that was lying under the table: she opened it, and found in it a very small cake, on which the words “EAT ME” were beautifully marked in currants. “Well, I’ll eat it,” said Alice, “and if it makes me grow larger, I can reach the key; and if it makes me grow smaller, I can creep under the door; so either way I’ll get into the garden, and I don’t care which happens!”", "She ate a little bit, and said anxiously to herself, “Which way? Which way?”, holding her hand on the top of her head to feel which way it was growing, and she was quite surprised to find that she remained the same size: to be sure, this generally happens when one eats cake, but Alice had got so much into the way of expecting nothing but out-of-the-way things to happen, that it seemed quite dull and stupid for life to go on in the common way.", "So she set to work, and very soon finished off the cake."]}, {"n": 2, "title": "The Pool of Tears", "paras": ["“Curiouser and curiouser!” cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English); “now I’m opening out like the largest telescope that ever was! Good-bye, feet!” (for when she looked down at her feet, they seemed to be almost out of sight, they were getting so far off). “Oh, my poor little feet, I wonder who will put on your shoes and stockings for you now, dears? I’m sure <em>I</em> shan’t be able! I shall be a great deal too far off to trouble myself about you: you must manage the best way you can;—but I must be kind to them,” thought Alice, “or perhaps they won’t walk the way I want to go! Let me see: I’ll give them a new pair of boots every Christmas.”", "And she went on planning to herself how she would manage it. “They must go by the carrier,” she thought; “and how funny it’ll seem, sending presents to one’s own feet! And how odd the directions will look!", "<em>Alice’s Right Foot, Esq., Hearthrug, near the Fender,</em> (<em>with Alice’s love</em>).", "Oh dear, what nonsense I’m talking!”", "Just then her head struck against the roof of the hall: in fact she was now more than nine feet high, and she at once took up the little golden key and hurried off to the garden door.", "Poor Alice! It was as much as she could do, lying down on one side, to look through into the garden with one eye; but to get through was more hopeless than ever: she sat down and began to cry again.", "“You ought to be ashamed of yourself,” said Alice, “a great girl like you,” (she might well say this), “to go on crying in this way! Stop this moment, I tell you!” But she went on all the same, shedding gallons of tears, until there was a large pool all round her, about four inches deep and reaching half down the hall.", "After a time she heard a little pattering of feet in the distance, and she hastily dried her eyes to see what was coming. It was the White Rabbit returning, splendidly dressed, with a pair of white kid gloves in one hand and a large fan in the other: he came trotting along in a great hurry, muttering to himself as he came, “Oh! the Duchess, the Duchess! Oh! won’t she be savage if I’ve kept her waiting!” Alice felt so desperate that she was ready to ask help of any one; so, when the Rabbit came near her, she began, in a low, timid voice, “If you please, sir—” The Rabbit started violently, dropped the white kid gloves and the fan, and skurried away into the darkness as hard as he could go.", "Alice took up the fan and gloves, and, as the hall was very hot, she kept fanning herself all the time she went on talking: “Dear, dear! How queer everything is to-day! And yesterday things went on just as usual. I wonder if I’ve been changed in the night? Let me think: was I the same when I got up this morning? I almost think I can remember feeling a little different. But if I’m not the same, the next question is, Who in the world am I? Ah, <em>that’s</em> the great puzzle!” And she began thinking over all the children she knew that were of the same age as herself, to see if she could have been changed for any of them.", "“I’m sure I’m not Ada,” she said, “for her hair goes in such long ringlets, and mine doesn’t go in ringlets at all; and I’m sure I can’t be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, <em>she’s</em> she, and <em>I’m</em> I, and—oh dear, how puzzling it all is! I’ll try if I know all the things I used to know. Let me see: four times five is twelve, and four times six is thirteen, and four times seven is—oh dear! I shall never get to twenty at that rate! However, the Multiplication Table doesn’t signify: let’s try Geography. London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, <em>that’s</em> all wrong, I’m certain! I must have been changed for Mabel! I’ll try and say ‘<em>How doth the little</em>—’” and she crossed her hands on her lap as if she were saying lessons, and began to repeat it, but her voice sounded hoarse and strange, and the words did not come the same as they used to do:—", "“How doth the little crocodile Improve his shining tail, And pour the waters of the Nile On every golden scale!", "“How cheerfully he seems to grin, How neatly spread his claws, And welcome little fishes in With gently smiling jaws!”", "“I’m sure those are not the right words,” said poor Alice, and her eyes filled with tears again as she went on, “I must be Mabel after all, and I shall have to go and live in that poky little house, and have next to no toys to play with, and oh! ever so many lessons to learn! No, I’ve made up my mind about it; if I’m Mabel, I’ll stay down here! It’ll be no use their putting their heads down and saying ‘Come up again, dear!’ I shall only look up and say ‘Who am I then? Tell me that first, and then, if I like being that person, I’ll come up: if not, I’ll stay down here till I’m somebody else’—but, oh dear!” cried Alice, with a sudden burst of tears, “I do wish they <em>would</em> put their heads down! I am so <em>very</em> tired of being all alone here!”", "As she said this she looked down at her hands, and was surprised to see that she had put on one of the Rabbit’s little white kid gloves while she was talking. “How <em>can</em> I have done that?” she thought. “I must be growing small again.” She got up and went to the table to measure herself by it, and found that, as nearly as she could guess, she was now about two feet high, and was going on shrinking rapidly: she soon found out that the cause of this was the fan she was holding, and she dropped it hastily, just in time to avoid shrinking away altogether.", "“That <em>was</em> a narrow escape!” said Alice, a good deal frightened at the sudden change, but very glad to find herself still in existence; “and now for the garden!” and she ran with all speed back to the little door: but, alas! the little door was shut again, and the little golden key was lying on the glass table as before, “and things are worse than ever,” thought the poor child, “for I never was so small as this before, never! And I declare it’s too bad, that it is!”", "As she said these words her foot slipped, and in another moment, splash! she was up to her chin in salt water. Her first idea was that she had somehow fallen into the sea, “and in that case I can go back by railway,” she said to herself. (Alice had been to the seaside once in her life, and had come to the general conclusion, that wherever you go to on the English coast you find a number of bathing machines in the sea, some children digging in the sand with wooden spades, then a row of lodging houses, and behind them a railway station.) However, she soon made out that she was in the pool of tears which she had wept when she was nine feet high.", "“I wish I hadn’t cried so much!” said Alice, as she swam about, trying to find her way out. “I shall be punished for it now, I suppose, by being drowned in my own tears! That <em>will</em> be a queer thing, to be sure! However, everything is queer to-day.”", "Just then she heard something splashing about in the pool a little way off, and she swam nearer to make out what it was: at first she thought it must be a walrus or hippopotamus, but then she remembered how small she was now, and she soon made out that it was only a mouse that had slipped in like herself.", "“Would it be of any use, now,” thought Alice, “to speak to this mouse? Everything is so out-of-the-way down here, that I should think very likely it can talk: at any rate, there’s no harm in trying.” So she began: “O Mouse, do you know the way out of this pool? I am very tired of swimming about here, O Mouse!” (Alice thought this must be the right way of speaking to a mouse: she had never done such a thing before, but she remembered having seen in her brother’s Latin Grammar, “A mouse—of a mouse—to a mouse—a mouse—O mouse!”) The Mouse looked at her rather inquisitively, and seemed to her to wink with one of its little eyes, but it said nothing.", "“Perhaps it doesn’t understand English,” thought Alice; “I daresay it’s a French mouse, come over with William the Conqueror.” (For, with all her knowledge of history, Alice had no very clear notion how long ago anything had happened.) So she began again: “Où est ma chatte?” which was the first sentence in her French lesson-book. The Mouse gave a sudden leap out of the water, and seemed to quiver all over with fright. “Oh, I beg your pardon!” cried Alice hastily, afraid that she had hurt the poor animal’s feelings. “I quite forgot you didn’t like cats.”", "“Not like cats!” cried the Mouse, in a shrill, passionate voice. “Would <em>you</em> like cats if you were me?”", "“Well, perhaps not,” said Alice in a soothing tone: “don’t be angry about it. And yet I wish I could show you our cat Dinah: I think you’d take a fancy to cats if you could only see her. She is such a dear quiet thing,” Alice went on, half to herself, as she swam lazily about in the pool, “and she sits purring so nicely by the fire, licking her paws and washing her face—and she is such a nice soft thing to nurse—and she’s such a capital one for catching mice—oh, I beg your pardon!” cried Alice again, for this time the Mouse was bristling all over, and she felt certain it must be really offended. “We won’t talk about her any more if you’d rather not.”", "“We indeed!” cried the Mouse, who was trembling down to the end of his tail. “As if <em>I</em> would talk on such a subject! Our family always <em>hated</em> cats: nasty, low, vulgar things! Don’t let me hear the name again!”", "“I won’t indeed!” said Alice, in a great hurry to change the subject of conversation. “Are you—are you fond—of—of dogs?” The Mouse did not answer, so Alice went on eagerly: “There is such a nice little dog near our house I should like to show you! A little bright-eyed terrier, you know, with oh, such long curly brown hair! And it’ll fetch things when you throw them, and it’ll sit up and beg for its dinner, and all sorts of things—I can’t remember half of them—and it belongs to a farmer, you know, and he says it’s so useful, it’s worth a hundred pounds! He says it kills all the rats and—oh dear!” cried Alice in a sorrowful tone, “I’m afraid I’ve offended it again!” For the Mouse was swimming away from her as hard as it could go, and making quite a commotion in the pool as it went.", "So she called softly after it, “Mouse dear! Do come back again, and we won’t talk about cats or dogs either, if you don’t like them!” When the Mouse heard this, it turned round and swam slowly back to her: its face was quite pale (with passion, Alice thought), and it said in a low trembling voice, “Let us get to the shore, and then I’ll tell you my history, and you’ll understand why it is I hate cats and dogs.”", "It was high time to go, for the pool was getting quite crowded with the birds and animals that had fallen into it: there were a Duck and a Dodo, a Lory and an Eaglet, and several other curious creatures. Alice led the way, and the whole party swam to the shore."]}];

function go(p,instant){S.page=Math.max(0,Math.min(N-1,p));flow.style.transform='translateX('+(-S.page*step)+'px)';save();
 const c=chapterOf(S.page),cs=chStart[c],ce=(chStart[c+1]??N);const left=ce-S.page-1;
 const mins=Math.max(1,Math.round(words[c]*(left/(ce-cs))/150));const pct=Math.round((S.page+1)/N*100);
 const pg=perScreen==2?(S.page*2+1)+'–'+(S.page*2+2):(S.page+1),tot=N*perScreen;
 $('#runhead').textContent=CH[c].title;$('#miniL').textContent=left?mins+' min left in chapter':'Last page in chapter';$('#miniR').textContent=pct+'%';
 $('#pL').textContent='Page '+pg+' of '+tot;$('#pC').textContent=left?(left+' page'+(left>1?'s':'')+' left in chapter'):'End of chapter';$('#pR').textContent=pct+'% · '+mins+' min';
 const f=N>1?S.page/(N-1)*100:0;$('#fill').style.width=f+'%';$('#knob').style.left=f+'%';
 $('#scrub').querySelectorAll('.tick').forEach(t=>t.remove());chStart.forEach(s=>{const t=document.createElement('div');t.className='tick';t.style.left=(N>1?s/(N-1)*100:0)+'%';$('#scrub').appendChild(t)});
 const on=S.marks.includes(S.page);$('#ribbon').classList.toggle('on',on);$('#bMark').classList.toggle('on',on);hidePop();}
const next=()=>go(S.page+1),prev=()=>go(S.page-1);

$$('.sizes .seg[data-d]').forEach(b=>b.onclick=()=>{S.size=Math.max(14,Math.min(32,S.size+ +b.dataset.d));layout(true)});
$$('#lhs .seg').forEach(b=>b.onclick=()=>{S.lh=+b.dataset.v;layout(true)});$$('#mgs .seg').forEach(b=>b.onclick=()=>{S.mg=b.dataset.v;layout(true)});

let sx=null,sy,st;const book=$('#book');
book.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;st=Date.now()});
book.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;const sel=getSelection();
 if(!sel.isCollapsed&&sel.toString().trim())return;
 if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();return}
 if(Date.now()-st>400||Math.abs(dx)>8)return;
 if(anyOpen()){$$('.sheet').forEach(s=>s.classList.remove('open'));return}
 const x=e.clientX/innerWidth;if(x<.28)prev();else if(x>.72)next();else chrome(document.body.classList.contains('immersive'))});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key))prev();if(e.key=='Escape'){$$('.sheet').forEach(s=>s.classList.remove('open'));chrome(false)}});
addEventListener('wheel',e=>{if(e.target.closest('#swati,.sheet'))return;if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<30)return;clearTimeout(window._w);window._w=setTimeout(()=>(e.deltaY+e.deltaX>0?next():prev()),40)},{passive:true});

let range=null;
document.addEventListener('selectionchange',()=>{clearTimeout(window._s);window._s=setTimeout(()=>{const s=getSelection();if(s.isCollapsed||!flow.contains(s.anchorNode)||!s.toString().trim())return hidePop();
 range=s.getRangeAt(0);const r=range.getBoundingClientRect();const p=$('#pop');p.style.left=Math.max(170,Math.min(innerWidth-170,r.left+r.width/2))+'px';p.style.top=Math.max(70,r.top-12)+'px';p.classList.add('open')},180)});
function hidePop(){$('#pop').classList.remove('open')}

const dict={curiosity:["kyoor-ee-OSS-i-tee","cu·ri·os·i·ty","noun","Wanting very much to know or learn something.","Alice's curiosity made her chase the rabbit!"],remarkable:["ri-MAR-kuh-bul","re·mark·a·ble","adjective","Unusual or special enough to be noticed.","A rabbit with a watch is very remarkable!"],waistcoat:["WESS-kut","waist·coat","noun","A short jacket with no sleeves, like a vest.","The Rabbit keeps his watch in his waistcoat pocket."],marmalade:["MAR-muh-layd","mar·ma·lade","noun","A sweet jam made from oranges.","Alice found an empty jar of orange marmalade while falling!"],curiouser:["KYOOR-ee-er-ser","cu·ri·ous·er","adjective (made-up!)","Alice's silly way of saying 'more and more curious'. The right word is 'more curious'.","She was so surprised she forgot good English!"],antipathies:["an-TIP-uh-theez","an·tip·a·thies","noun","Alice means 'Antipodes', the other side of the world. She mixed up the word!","Even Alice gets words wrong sometimes, and that's okay."],latitude:["LAT-i-tood","lat·i·tude","noun","A line on a map that tells how far north or south a place is.","Alice says it to sound clever, but she doesn't know what it means!"]};

function define(t){seg('words');const k=t.toLowerCase().replace(/[^a-z\-]/g,'');const d=dict[k]||[k,k,'word','Let\'s figure it out together. Read the sentence around it out loud. What could it mean?','Try using it in your own sentence!'];
 const ex=d[4].replace(new RegExp('('+k+')','i'),'<b>$1</b>');const c=document.createElement('div');c.className='wc';
 c.innerHTML='<div class="art">'+(ART[k]||GEN)+'<span class="lbl2">Picture it</span></div><div class="in"><div class="top"><div><h3>'+k+'</h3><div class="pos">'+d[2]+'</div></div><button class="play" onclick="speak(\''+k+'\')" title="Hear it"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7" fill="none"/></svg></button></div><div class="ph">/ '+d[0]+' /</div><div class="syl">'+d[1].split('·').map(x=>'<span onclick="speak(this.textContent)">'+x+'</span>').join('<em>·</em>')+'</div><div class="sec">Meaning</div><p class="mean">'+d[3]+'</p><div class="sec">In the story</div><p class="ex">'+ex+'</p><div class="acts"><button onclick="speak(\''+k+'\')">Say it slowly</button><button>Add to My Words</button></div></div>';
 sb.appendChild(c);c.scrollIntoView({block:'start',behavior:'smooth'})}

const sw=$('#swati'),tab=$('#tab');
function placeSwati(){const w=sw.offsetWidth,vw=innerWidth;S.top=Math.max(60,Math.min(innerHeight-sw.offsetHeight-12,S.top));sw.style.top=S.top+'px';
 if(S.state=='open'){sw.classList.remove('hidden');sw.style.left=(S.side=='right'?vw-w-12:12)+'px';tab.classList.remove('show')}
 else if(S.state=='stashed'){sw.style.left=(S.side=='right'?vw+40:-w-40)+'px';tab.className='show '+(S.side=='right'?'r':'l');tab.style.top=Math.min(innerHeight-120,S.top+120)+'px'}
 else{sw.classList.add('hidden');tab.classList.remove('show')}}
function swOpen(){if(S.state=='closed')sw.classList.add('drag'),sw.style.left=(S.side=='right'?innerWidth+20:-sw.offsetWidth-20)+'px',sw.offsetWidth,sw.classList.remove('drag','hidden');S.state='open';save();placeSwati()}

function drag(handle,fromTab){let ox,oy,x0,y0,moved;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button')&&!fromTab)return;handle.setPointerCapture(e.pointerId);moved=false;ox=e.clientX;oy=e.clientY;
 if(fromTab){S.state='open';sw.classList.remove('hidden');}x0=sw.offsetLeft;y0=sw.offsetTop;sw.classList.add('drag');
 if(fromTab){x0=S.side=='right'?innerWidth:-sw.offsetWidth;sw.style.left=x0+'px'}});
 handle.addEventListener('pointermove',e=>{if(ox==null)return;const dx=e.clientX-ox,dy=e.clientY-oy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;sw.style.left=(x0+dx)+'px';if(!fromTab)sw.style.top=(y0+dy)+'px'});
 handle.addEventListener('pointerup',e=>{if(ox==null)return;sw.classList.remove('drag');const w=sw.offsetWidth,l=sw.offsetLeft,vw=innerWidth;ox=null;
  if(fromTab&&!moved){S.state='open';save();return placeSwati()}
  if(!fromTab)S.top=sw.offsetTop;
  const over=l+w-vw,under=-l;
  if(over>w*.3){S.side='right';S.state='stashed'}else if(under>w*.3){S.side='left';S.state='stashed'}
  else{S.state='open';S.side=(l+w/2)>vw/2?'right':'left'}save();placeSwati()})}
